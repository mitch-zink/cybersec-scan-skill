rules:
  - id: sql-concat-js
    languages: [javascript, typescript]
    severity: ERROR
    message: SQL built by string concatenation. Use bound parameters.
    metadata: {cwe: CWE-89, owasp: A05, fix: "Pass values as bound parameters, not concatenated text."}
    patterns:
      - pattern-either:
          - pattern: $DB.query($SQL, ...)
          - pattern: $DB.execute($SQL, ...)
          - pattern: $DB.raw($SQL, ...)
      - metavariable-pattern:
          metavariable: $SQL
          pattern-either:
            - pattern: '"..." + ...'
            - pattern: '... + "..."'
  - id: sql-format-py
    languages: [python]
    severity: ERROR
    message: SQL built with formatting. Use bound parameters.
    metadata: {cwe: CWE-89, owasp: A05, fix: "Use the driver's parameter placeholders."}
    pattern-either:
      - pattern: $C.execute(f"...", ...)
      - pattern: $C.execute("..." % $X, ...)
      - pattern: $C.execute("...".format(...), ...)
      - pattern: $C.execute("..." + ..., ...)
      - pattern: $C.execute(... + "...", ...)
  - id: os-command-js
    languages: [javascript, typescript]
    severity: ERROR
    message: Shell command built from a string. Use execFile with an argument list.
    metadata: {cwe: CWE-78, owasp: A05, fix: "Use child_process.execFile with a fixed command and an argument array."}
    patterns:
      - pattern-either:
          - pattern: $CP.exec($CMD, ...)
          - pattern: $CP.execSync($CMD, ...)
      - metavariable-pattern:
          metavariable: $CMD
          pattern-either:
            - pattern: '"..." + ...'
            - pattern: '... + "..."'
  - id: os-command-py
    languages: [python]
    severity: ERROR
    message: Shell command built from a string or run with shell=True.
    metadata: {cwe: CWE-78, owasp: A05, fix: "Pass an argument list and do not use shell=True."}
    patterns:
      - pattern-either:
          - pattern: os.system(f"...")
          - pattern: os.system("..." + $X)
          - pattern: subprocess.$F(..., shell=True, ...)
      - pattern-not: os.system("..." + shlex.quote(...))
  - id: path-join-open-py
    languages: [python]
    severity: WARNING
    message: File path built from input. Check it stays inside the base folder.
    metadata: {cwe: CWE-22, owasp: A01, fix: "Resolve the path and check it starts with the base folder."}
    pattern: open(os.path.join($B, $X), ...)
  - id: taint-ssrf-py
    mode: taint
    languages: [python]
    severity: WARNING
    message: Request data sets the URL of an outbound request. Check the host allowlist.
    metadata: {cwe: CWE-918, owasp: A01, fix: "Allow only known hosts. Block private address ranges."}
    pattern-sources:
      - pattern-either:
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.get_json(...)
          - pattern: request.json
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.$M($U, ...)
              - pattern: urllib.request.urlopen($U, ...)
              - pattern: httpx.$M($U, ...)
          - focus-metavariable: $U
  - id: weak-hash-py
    languages: [python]
    severity: WARNING
    message: MD5 or SHA-1 is weak for passwords and signatures.
    metadata: {cwe: CWE-327, owasp: A04, fix: "Use bcrypt, scrypt, or argon2 for passwords. Use SHA-256 or stronger for integrity."}
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
  - id: unsafe-deserialize-py
    languages: [python]
    severity: ERROR
    message: Unsafe deserialization of input.
    metadata: {cwe: CWE-502, owasp: A08, fix: "Use yaml.safe_load. Do not unpickle untrusted data."}
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: yaml.load($X)
  - id: tls-verify-off-py
    languages: [python]
    severity: ERROR
    message: TLS certificate check turned off.
    metadata: {cwe: CWE-295, owasp: A04, fix: "Remove verify=False. Set a CA bundle if needed."}
    pattern: requests.$M(..., verify=False, ...)
  - id: tls-reject-off-js
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS certificate check turned off.
    metadata: {cwe: CWE-295, owasp: A04, fix: "Remove rejectUnauthorized: false."}
    pattern: "{..., rejectUnauthorized: false, ...}"
  - id: react-raw-html
    languages: [javascript, typescript]
    severity: WARNING
    message: Raw HTML inserted into the page. Check the input is escaped or trusted.
    metadata: {cwe: CWE-79, owasp: A05, fix: "Render text as children. Sanitize HTML with a vetted library if HTML is needed."}
    pattern: "<$E dangerouslySetInnerHTML={{__html: $X}} />"
  - id: taint-sql-py
    mode: taint
    languages: [python]
    severity: ERROR
    message: Request data reaches a SQL string. Use bound parameters.
    metadata: {cwe: CWE-89, owasp: A05, fix: "Pass request values as bound parameters."}
    pattern-sources:
      - pattern-either:
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.get_json(...)
          - pattern: request.json
    pattern-sanitizers:
      - pattern: int(...)
    pattern-sinks:
      - patterns:
          - pattern: $C.execute($Q, ...)
          - focus-metavariable: $Q
  - id: taint-cmd-py
    mode: taint
    languages: [python]
    severity: ERROR
    message: Request data reaches a shell command.
    metadata: {cwe: CWE-78, owasp: A05, fix: "Pass an argument list. Do not build a command string from request data."}
    pattern-sources:
      - pattern-either:
          - pattern: request.args
          - pattern: request.form
          - pattern: request.get_json(...)
    pattern-sanitizers:
      - pattern: shlex.quote(...)
    pattern-sinks:
      - pattern-either:
          - pattern: os.system(...)
          - pattern: subprocess.$F(..., shell=True, ...)
  - id: taint-sql-js
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: Request data reaches a SQL string. Use bound parameters.
    metadata: {cwe: CWE-89, owasp: A05, fix: "Pass request values as bound parameters."}
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.body
          - pattern: $REQ.query
          - pattern: $REQ.params
          - pattern: await $REQ.json()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($Q, ...)
              - pattern: $DB.raw($Q, ...)
              - pattern: $DB.execute($Q, ...)
          - focus-metavariable: $Q
  - id: taint-ssrf-js
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: Request data sets the URL of an outbound request. Check the host allowlist.
    metadata: {cwe: CWE-918, owasp: A01, fix: "Allow only known hosts. Block private address ranges."}
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.body
          - pattern: $REQ.query
          - pattern: await $REQ.json()
    pattern-sinks:
      - patterns:
          - pattern: fetch($U, ...)
          - focus-metavariable: $U
  - id: supabase-service-key-client
    languages: [javascript, typescript]
    severity: ERROR
    message: Service-role key used in client code. It bypasses row-level security for every visitor.
    metadata: {cwe: CWE-798, owasp: A01, fix: "Use the anon or publishable key in the browser. Keep the service key on the server."}
    paths:
      include: ["src/", "app/", "pages/", "components/"]
      exclude: ["*.test.*", "*.spec.*"]
    pattern-either:
      - patterns:
          - pattern: import.meta.env.$V
          - metavariable-regex: {metavariable: $V, regex: '(?i).*service_?role.*'}
      - patterns:
          - pattern: process.env.$V
          - metavariable-regex: {metavariable: $V, regex: '(?i)^(NEXT_PUBLIC|VITE|REACT_APP|EXPO_PUBLIC)_.*service_?role.*'}
  - id: supabase-cors-wildcard
    languages: [javascript, typescript]
    severity: WARNING
    message: CORS allows every origin. Check that the function needs no cookie or user session.
    metadata: {cwe: CWE-942, owasp: A02, fix: "Set Access-Control-Allow-Origin to the app's own origins."}
    pattern-either:
      - pattern: '{..., "Access-Control-Allow-Origin": "*", ...}'
      - pattern: '{..., "access-control-allow-origin": "*", ...}'
